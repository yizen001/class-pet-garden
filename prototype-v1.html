<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fc">
<title>班级宠物园 · 课堂成长激励</title>
<style>
:root{
  --bg:#f5f7fc; --surface:#ffffff; --surface-2:#f9fbff; --ink:#1e2942; --ink-2:#4a5872;
  --muted:#8592a8; --line:#e7ecf5; --brand:#5965e8; --brand-soft:#eef0ff;
  --orange:#ff8a58; --mint:#2fbe9d; --red:#ef6a73; --gold:#f3b53f; --purple:#a374e8;
  --shadow:0 6px 22px rgba(35,52,92,.07); --shadow-lg:0 18px 50px rgba(35,52,92,.16);
  --r:18px; --sidebar:232px; --header:72px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{outline:none}
svg{display:block}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#d8e0ee;border-radius:9px}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:3px solid rgba(89,101,232,.45);outline-offset:2px}

/* ---------- 布局 ---------- */
.app{min-height:100%}
.sidebar{
  position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:var(--surface);
  border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;
}
.brand{display:flex;align-items:center;gap:11px;padding:22px 20px 18px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(140deg,var(--brand),#8e7bf0);
  display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px rgba(89,101,232,.32);flex:none}
.brand-mark svg{width:23px;height:23px}
.brand-txt strong{display:block;font-size:16px;letter-spacing:.3px}
.brand-txt span{display:block;font-size:11.5px;color:var(--muted);letter-spacing:1.4px}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:4px;flex:1;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:11px 13px;border-radius:12px;
  color:var(--ink-2);font-weight:600;font-size:14px;text-align:left;transition:.18s}
.nav-item svg{width:20px;height:20px;flex:none;opacity:.8}
.nav-item:hover{background:var(--surface-2);color:var(--brand)}
.nav-item.active{background:var(--brand-soft);color:var(--brand)}
.nav-item.active svg{opacity:1}
.side-foot{padding:14px 16px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.side-foot b{display:block;color:var(--ink-2);font-size:13px;margin-bottom:2px}
.main{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:var(--header);display:flex;align-items:center;gap:14px;padding:0 clamp(16px,2.4vw,34px);
  background:rgba(245,247,252,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:20}
.topbar h1{font-size:clamp(17px,1.6vw,21px);font-weight:750;letter-spacing:.2px;white-space:nowrap;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{font-size:12.5px;color:var(--muted);white-space:nowrap}
.topbar-spacer{flex:1}
.class-select{display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:8px 11px;font-size:13.5px;font-weight:650;max-width:210px}
.class-select select{border:0;background:none;font-weight:650;max-width:150px;cursor:pointer}
.content{padding:clamp(16px,2.4vw,32px);max-width:1680px;margin:0 auto}
.view{display:none;animation:fade .28s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tabbar{display:none}

/* ---------- 通用组件 ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.section-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
.section-head h2{font-size:clamp(17px,1.5vw,20px);font-weight:750}
.section-head p{font-size:13px;color:var(--muted);margin-top:2px}
.section-head .grow{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 15px;border-radius:11px;
  font-size:13.5px;font-weight:650;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  transition:.18s;white-space:nowrap;min-height:40px}
.btn svg{width:16px;height:16px}
.btn:hover{transform:translateY(-1px);border-color:#cfd8ea;box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 6px 16px rgba(89,101,232,.24)}
.btn.primary:hover{background:#4a56d8}
.btn.soft{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.btn.warn{background:#fff2f2;color:var(--red);border-color:#ffdfe1}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:6px 11px;min-height:34px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.input,.select,textarea.input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface-2);font-size:14px;min-height:42px}
.input:focus,.select:focus,textarea.input:focus{border-color:var(--brand);background:#fff;box-shadow:0 0 0 3px rgba(89,101,232,.1)}
textarea.input{min-height:110px;resize:vertical;line-height:1.7}
label.field{display:block;margin-bottom:13px}
label.field>span{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-bottom:6px}
.hint{font-size:12px;color:var(--muted);line-height:1.7}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;white-space:nowrap;
  background:var(--surface-2);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink-2)}
.toolbar>.chip{flex:none}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:1.6}
.pill.g{background:#e6f8f2;color:#168a6e}.pill.o{background:#fff0e7;color:#d46a35}
.pill.r{background:#ffebed;color:#d1535d}.pill.p{background:#f1ecff;color:#7c53c9}
.pill.b{background:#eaeefe;color:#4c58cf}
.empty{text-align:center;padding:52px 20px;color:var(--muted)}
.empty svg{width:46px;height:46px;margin:0 auto 12px;opacity:.4}
.empty strong{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* ---------- 统计条 ---------- */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:15px 17px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:13px}
.stat-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.stat-ico svg{width:20px;height:20px}
.stat b{display:block;font-size:clamp(19px,2vw,24px);font-weight:780;line-height:1.2}
.stat span{font-size:12px;color:var(--muted)}

/* ---------- 工具栏 ---------- */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:11px;padding:0 12px;min-height:42px;flex:1 1 220px;max-width:340px}
.search svg{width:17px;height:17px;color:var(--muted);flex:none}
.search input{border:0;background:none;width:100%;font-size:13.5px}
.chips-row{display:flex;gap:8px;flex-wrap:wrap}
.chips-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips-scroll::-webkit-scrollbar{display:none}
.chips-scroll .chip{white-space:nowrap;cursor:pointer}

/* ---------- 宠物卡 ---------- */
.pet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(172px,17vw,224px),1fr));gap:14px}
.pet-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);
  overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative;text-align:left;width:100%}
.pet-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:#d5def2}
.pet-card.hidden{display:none}
.pet-scene{height:clamp(140px,15vw,180px);position:relative;display:grid;place-items:center;overflow:hidden}
.pet-scene::after{content:"";position:absolute;inset:auto 0 0;height:38px;background:linear-gradient(transparent,rgba(255,255,255,.55))}
.pet-svg{width:min(88%,170px);height:auto;max-height:100%;position:relative;z-index:1}
.pet-bob{animation:bob 3.4s ease-in-out infinite;transform-origin:center}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.pet-lv{position:absolute;top:11px;left:11px;z-index:2;background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.8);
  border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;color:var(--brand);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pet-mood{position:absolute;top:11px;right:11px;z-index:2;width:26px;height:26px;border-radius:50%;
  background:rgba(255,255,255,.92);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.pet-mood svg{width:15px;height:15px}
.pet-body{padding:12px 14px 14px}
.pet-name{display:flex;align-items:baseline;gap:7px;min-width:0}
.pet-name strong{font-size:14.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-name small{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pet-owner{font-size:12px;color:var(--muted);margin:2px 0 10px}
.pet-meta{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.pet-meta b{color:var(--ink-2);font-size:12px}
.bar{height:7px;background:#edf1f8;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),#8b7cf1);transition:width .4s}
.bar.mint>i{background:linear-gradient(90deg,#28b393,#6cd9b7)}
.bar.gold>i{background:linear-gradient(90deg,#efa72c,#f7cf6c)}
.pet-acc{display:flex;gap:4px;margin-top:9px;flex-wrap:wrap}
.pet-acc i{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.adopt-card{border:1.5px dashed #cbd5ea;background:var(--surface-2);box-shadow:none}
.adopt-card:hover{border-color:var(--brand);box-shadow:var(--shadow)}
.adopt-plus{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;
  color:var(--brand);box-shadow:var(--shadow);margin:0 auto 10px}
.adopt-plus svg{width:24px;height:24px}

/* ---------- 批量评价 ---------- */
.score-layout{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
.panel{padding:18px}
.panel h3{font-size:15px;font-weight:750;margin-bottom:4px}
.panel .hint{margin-bottom:14px}
.stu-pick{display:flex;flex-wrap:wrap;gap:7px;max-height:min(48vh,430px);overflow-y:auto;padding:2px}
.stu-chip{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:7px 11px;
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.stu-chip i{width:8px;height:8px;border-radius:50%;background:#cbd5ea}
.stu-chip.on{background:var(--brand-soft);border-color:#c9cffb;color:var(--brand)}
.stu-chip.on i{background:var(--brand)}
.rule-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.rule{border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:var(--surface);text-align:left;
  transition:.18s;display:flex;flex-direction:column;gap:7px;min-height:86px}
.rule:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--shadow)}
.rule.hidden{display:none}
.rule .rt{font-size:13.5px;font-weight:650;line-height:1.45;flex:1}
.rule .rv{font-size:16px;font-weight:800}
.rule .rv.plus{color:var(--mint)}.rule .rv.minus{color:var(--red)}
.rule .del{position:absolute}
.rule-cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.sel-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand-soft);border-radius:12px;
  padding:10px 13px;margin-bottom:14px;font-size:13px;color:var(--brand);font-weight:650}
.sel-bar .grow{flex:1}

/* ---------- 排行榜 ---------- */
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:end;margin-bottom:18px;max-width:720px;margin-left:auto;margin-right:auto}
.podium-item{border-radius:18px;padding:16px 12px;text-align:center;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.podium-item.first{background:linear-gradient(170deg,#fff7e2,#fff);border-color:#f6dda2;padding-top:24px}
.podium-item .rank-no{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px}
.podium-item .p-svg{width:96px;height:96px;margin:2px auto}
.podium-item strong{display:block;font-size:14.5px;margin-top:2px}
.podium-item span{font-size:12px;color:var(--muted)}
.podium-item b{display:block;color:var(--brand);font-size:18px;margin-top:4px}
.rank-list{display:flex;flex-direction:column;gap:9px}
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;box-shadow:var(--shadow)}
.rank-no{width:30px;height:30px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;
  font-weight:800;font-size:13px;color:var(--muted);flex:none}
.rank-row:nth-child(-n+3) .rank-no{background:var(--brand-soft);color:var(--brand)}
.rank-av{width:42px;height:42px;border-radius:13px;background:var(--brand-soft);display:grid;place-items:center;
  font-weight:800;color:var(--brand);flex:none;font-size:15px}
.rank-info{flex:1;min-width:0}
.rank-info strong{display:block;font-size:14px}
.rank-info span{font-size:11.5px;color:var(--muted)}
.rank-score{font-weight:800;color:var(--brand);font-size:17px;white-space:nowrap}
.rank-score small{font-size:11px;color:var(--muted);font-weight:600;margin-left:2px}

/* ---------- 小卖部 ---------- */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.good{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:9px}
.good-ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;color:#fff}
.good-ico svg{width:27px;height:27px}
.good h4{font-size:15px;font-weight:750}
.good p{font-size:12.5px;color:var(--muted);flex:1;min-height:34px}
.good-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.price{font-size:13px;font-weight:800;color:#c98a16;display:flex;align-items:center;gap:4px}
.price svg{width:15px;height:15px}

/* ---------- 记录 ---------- */
.rec-list{display:flex;flex-direction:column;gap:8px}
.rec{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:11px 14px;box-shadow:var(--shadow)}
.rec-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:none;font-weight:800;font-size:14px}
.rec-ico.plus{background:#e6f8f2;color:#168a6e}.rec-ico.minus{background:#ffebed;color:#d1535d}
.rec-ico.other{background:var(--brand-soft);color:var(--brand)}
.rec-main{flex:1;min-width:0}
.rec-main strong{display:block;font-size:13.5px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-main span{font-size:11.5px;color:var(--muted)}
.rec-val{font-weight:800;font-size:15px;white-space:nowrap}
.rec-val.plus{color:var(--mint)}.rec-val.minus{color:var(--red)}
.rec.undone{opacity:.5}
.rec.undone .rec-main strong{text-decoration:line-through}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:650}
.tbl-wrap{overflow-x:auto}
.form-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.set-block{padding:18px;margin-bottom:16px}
.set-block h3{font-size:15px;font-weight:750;margin-bottom:3px}
.set-block .hint{margin-bottom:14px}
.line-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.line-row:last-child{border-bottom:0}
.line-row .grow{flex:1;min-width:90px}
.line-row b{font-size:13.5px;font-weight:650}

/* ---------- 弹窗 ---------- */
.backdrop{position:fixed;inset:0;background:rgba(20,30,55,.45);backdrop-filter:blur(3px);z-index:60;animation:fade .2s}
.modal{position:fixed;z-index:61;top:50%;left:50%;transform:translate(-50%,-50%);width:min(94vw,560px);
  max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:22px;box-shadow:var(--shadow-lg);animation:pop .24s ease}
.modal.wide{width:min(94vw,720px)}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.modal-head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px;position:sticky;top:0;background:var(--surface);z-index:2}
.modal-head h3{font-size:17px;font-weight:750;flex:1}
.modal-body{padding:4px 20px 18px}
.modal-foot{display:flex;gap:9px;padding:14px 20px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.modal-foot .btn{flex:1}
.x-btn{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted)}
.x-btn:hover{background:var(--surface-2)}
.x-btn svg{width:18px;height:18px}
.pet-detail-hero{border-radius:16px;padding:10px;display:grid;place-items:center;margin-bottom:14px}
.pet-detail-hero .pet-svg{width:min(210px,60vw)}
.status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0}
.status-box{background:var(--surface-2);border-radius:12px;padding:9px 10px;text-align:center}
.status-box span{font-size:11.5px;color:var(--muted)}
.status-box b{display:block;font-size:15px;margin:1px 0 5px}
.status-box .bar{height:5px}
.species-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.species-opt{border:1.5px solid var(--line);border-radius:13px;padding:8px 4px;text-align:center;cursor:pointer;background:var(--surface-2)}
.species-opt svg{width:56px;height:56px;margin:0 auto}
.species-opt span{font-size:11.5px;font-weight:650;display:block}
.species-opt.on{border-color:var(--brand);background:var(--brand-soft)}
.quick-rules{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:8px}
.quick-rule{border:1px solid var(--line);border-radius:10px;padding:8px 9px;font-size:12.5px;text-align:left;font-weight:600;background:var(--surface-2)}
.quick-rule b{display:block;font-size:12px;margin-top:2px}
.quick-rule.plus b{color:var(--mint)}.quick-rule.minus b{color:var(--red)}
.acc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px}
.acc-opt{border:1.5px solid var(--line);border-radius:11px;padding:9px;font-size:12.5px;font-weight:650;text-align:center;background:var(--surface-2)}
.acc-opt.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}

/* ---------- 提示 / 大屏 ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#222e4c;color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;font-weight:600;
  box-shadow:var(--shadow-lg);animation:toastIn .24s ease;max-width:88vw;text-align:center}
.toast.ok{background:#1f9b7e}.toast.bad{background:#d75a64}
@keyframes toastIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.screen-exit{display:none;position:fixed;top:16px;right:16px;z-index:80}
body.screen-mode{overflow:auto}
body.screen-mode .sidebar,body.screen-mode .topbar,body.screen-mode .tabbar,
body.screen-mode .stat-row,body.screen-mode .toolbar,body.screen-mode .section-head{display:none!important}
body.screen-mode .main{margin-left:0}
body.screen-mode .content{padding:20px;max-width:none}
body.screen-mode .pet-grid{grid-template-columns:repeat(auto-fill,minmax(clamp(180px,14vw,250px),1fr));gap:18px}
body.screen-mode .pet-scene{height:clamp(170px,17vw,230px)}
body.screen-mode .screen-exit{display:inline-flex}
body.screen-mode .pet-card{box-shadow:0 8px 28px rgba(35,52,92,.1)}
.screen-banner{display:none;text-align:center;padding:6px 0 20px}
body.screen-mode .screen-banner{display:block}
.screen-banner h2{font-size:clamp(22px,2.6vw,36px);font-weight:800;letter-spacing:1px}
.screen-banner p{color:var(--muted);font-size:14px}
.levelup{animation:levelup .8s ease}
@keyframes levelup{0%{box-shadow:0 0 0 0 rgba(243,181,63,.7)}100%{box-shadow:0 0 0 22px rgba(243,181,63,0)}}

/* ---------- 响应式 ---------- */
@media (max-width:1180px){
  .score-layout{grid-template-columns:1fr}
  .stu-pick{max-height:190px}
}
@media (max-width:900px){
  :root{--header:60px}
  .sidebar{display:none}
  .main{margin-left:0;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
  .topbar{padding:0 16px}
  .topbar .sub{display:none}
  .content{padding:16px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;width:100%;z-index:40;background:rgba(255,255,255,.96);
    backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -6px 22px rgba(35,52,92,.06)}
  .tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 2px;min-height:52px;
    color:var(--muted);font-size:10.5px;font-weight:650;border-radius:11px}
  .tab svg{width:21px;height:21px}
  .tab.active{color:var(--brand);background:var(--brand-soft)}
  .pet-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
  .pet-scene{height:clamp(126px,25vw,160px)}
  .modal{top:auto;bottom:0;left:0;transform:none;width:100%;max-height:90vh;border-radius:22px 22px 0 0;
    animation:sheet .26s ease;padding-bottom:env(safe-area-inset-bottom)}
  .modal.wide{width:100%}
  @keyframes sheet{from{transform:translateY(100%)}to{transform:none}}
  .modal-foot{position:sticky}
  .podium{gap:7px}
  .podium-item{padding:12px 6px}
  .podium-item .p-svg{width:74px;height:74px}
  .class-select{max-width:150px}
}
@media (max-width:560px){
  .topbar h1{font-size:16px}
  .class-select{padding:7px 9px;font-size:12.5px}
  .class-select svg{display:none}
  .stat-row{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat{padding:11px 12px;gap:9px}
  .stat-ico{width:34px;height:34px}
  .pet-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .pet-scene{height:clamp(118px,32vw,160px)}
  .pet-body{padding:10px 11px 12px}
  .rule-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .rule{min-height:78px;padding:10px}
  .shop-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .good{padding:12px}
  .species-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .species-opt svg{width:44px;height:44px}
  .podium-item .p-svg{width:58px;height:58px}
  .podium-item strong{font-size:12.5px}
  .podium-item b{font-size:15px}
  .section-head .btn{padding:8px 11px}
  .form-row{grid-template-columns:1fr}
  .rec{padding:9px 11px;gap:9px}
  .rec-val{font-size:14px}
  body.screen-mode .pet-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:360px){
  .pet-grid,.shop-grid{grid-template-columns:1fr}
  .rule-grid{grid-template-columns:1fr}
}
@media (min-width:1700px){
  .content{padding:32px 44px}
  .pet-grid{gap:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media print{.sidebar,.topbar,.tabbar,.toolbar,.btn{display:none!important}.main{margin:0}.pet-card{break-inside:avoid}}

function ic(n,size){return '<svg viewBox="0 0 24 24" width="'+(size||20)+'" height="'+(size||20)+'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}
function icFill(n,size,color){return '<svg viewBox="0 0 24 24" width="'+(size||20)+'" height="'+(size||20)+'" fill="'+(color||'currentColor')+'" aria-hidden="true">'+ICON[n]+'</svg>';}

const SPECIES={
  cat:{n:'橘猫',body:'#f9b06a',belly:'#ffe4c4',dark:'#c97c3c',ear:'triangle',tail:'curl',bg1:'#fff2df',bg2:'#ffe2bf'},
  dog:{n:'柴犬',body:'#d79a62',belly:'#f8e5cb',dark:'#a56c3c',ear:'flop',tail:'curl',bg1:'#fff1e2',bg2:'#ffdcb9'},
  rabbit:{n:'垂耳兔',body:'#f3c9dc',belly:'#fff0f6',dark:'#cf8fae',ear:'long',tail:'puff',bg1:'#fff0f6',bg2:'#f9d7e8'},
  panda:{n:'熊猫',body:'#f2f5fb',belly:'#ffffff',dark:'#3b4359',ear:'round',tail:'puff',bg1:'#eef4ff',bg2:'#dce8ff'},
  fox:{n:'小狐狸',body:'#f28c5c',belly:'#ffe9d9',dark:'#c9613a',ear:'triangle',tail:'bushy',bg1:'#fff0e6',bg2:'#ffd9c2'},
  dragon:{n:'小龙',body:'#7ad0a8',belly:'#d9f6e6',dark:'#3c9a76',ear:'horn',tail:'spike',bg1:'#e8faf1',bg2:'#cdf1de'},
  penguin:{n:'企鹅',body:'#55628c',belly:'#f6f9ff',dark:'#333d61',ear:'none',tail:'none',bg1:'#eaf0ff',bg2:'#d6e2ff'},
  unicorn:{n:'独角兽',body:'#c9b3f5',belly:'#f2ecff',dark:'#9270cf',ear:'horn',tail:'rainbow',bg1:'#f5efff',bg2:'#e6d9ff'}
};
const STAGES=['','幼崽期','成长期','活泼期','进阶期','闪耀期','王者期','传说形态'];
const CATS=['学习','行为','健康','其他'];
const CAT_COLOR={'学习':'#5965e8','行为':'#2fbe9d','健康':'#ff8a58','其他':'#a374e8'};
const ACCS={hat:{n:'小红帽'},bow:{n:'蝴蝶结'},scarf:{n:'小围巾'},glasses:{n:'圆眼镜'},crown:{n:'金皇冠'},wings:{n:'小翅膀'},medal:{n:'奖牌'}};
const MOODS={happy:{n:'开心',i:'smile',c:'#2fbe9d'},calm:{n:'平静',i:'smile',c:'#8592a8'},sad:{n:'低落',i:'sad',c:'#f3b53f'},sick:{n:'不舒服',i:'sick',c:'#ef6a73'}};
const NAV=[{v:'garden',t:'宠物园',i:'paw'},{v:'score',t:'加减分',i:'target'},{v:'rank',t:'排行榜',i:'trophy'},{v:'shop',t:'小卖部',i:'shop'},{v:'manage',t:'管理',i:'gear'}];
const PAGE={garden:['宠物园','每位同学都有一只随表现成长的伙伴'],score:['加减分','选择学生与评价项，一键批量记录'],rank:['排行榜','看见每一点进步'],shop:['小卖部','用升级获得的徽章兑换奖励'],manage:['管理','学生、规则、成长设置与数据']};

const DEFAULT_RULES=[
  ['学习','作业完成优秀',1],['学习','课堂主动发言',2],['学习','默写全对',2],['学习','单元测验进步',3],
  ['学习','早读认真专注',1],['学习','订正态度认真',1],['学习','作业未按时交',-2],['学习','上课开小差',-1],
  ['行为','主动帮助同学',2],['行为','拾金不昧',3],['行为','小组合作满分',2],['行为','为班级争得荣誉',5],

];

  ['免作业卡',16,'当周免一次书面作业',10,'gift','#5965e8','real'],
  ['优先选座券',12,'优先挑选一周座位',8,'star','#f3b53f','real'],
  ['文具小礼包',8,'铅笔、橡皮或小本子',15,'book','#2fbe9d','real'],

  ['小皇冠',6,'给宠物戴上金皇冠',-1,'sparkle','#ef9c3f','acc:crown'],
  ['蝴蝶结',4,'给宠物系上蝴蝶结',-1,'heart','#ef6a73','acc:bow'],
  ['圆眼镜',5,'给宠物戴上圆眼镜',-1,'search','#5965e8','acc:glasses'],
  ['小围巾',5,'给宠物围上小围巾',-1,'gift','#2fbe9d','acc:scarf']
];
const DEMO_NAMES=['陈冠霖','陈思琪','覃子侨','梁鸿文','李明轩','王一诺','张雨桐','赵子睿','刘欣怡','周浩然'];

/* ==================== 状态 ==================== */
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayKey=()=>dayKey();
function weekStart(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();}
function fmt(ts){const d=new Date(ts);return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}

function demoState(){
  const classId=uid();
  const students=DEMO_NAMES.map((name,i)=>{
    const sp=Object.keys(SPECIES)[i%8];
    const exp=[0,12,48,96,150,235,340,470,610,735][i];
    const adopted=i!==0;
    return {id:uid(),name,seat:i+1,adopted,species:sp,petName:adopted?['团子','小满','糖豆','云朵','阿福','豆包','星星','风铃','布丁','可乐'][i]:'',
      exp,badges:Math.max(0,Math.floor(exp/120)),acc:[],status:{hunger:clamp(50+i*4,20,95),joy:clamp(45+i*5,20,98),health:clamp(60+i*3,25,99)},interactDate:'',interactLeft:3};
  });
  const rules=DEFAULT_RULES.map(r=>({id:uid(),cat:r[0],label:r[1],delta:r[2]}));
  const goods=DEFAULT_GOODS.map(g=>({id:uid(),name:g[0],cost:g[1],desc:g[2],stock:g[3],icon:g[4],color:g[5],kind:g[6]}));
  const records=[];
  students.slice(1,7).forEach((s,i)=>{
    const r=rules[[0,1,2,8,9,10][i]];
    records.push({id:uid(),ts:Date.now()-(i+1)*3600000*7,classId,studentId:s.id,label:r.label,delta:r.delta,cat:r.cat,kind:'score',undone:false});
  });
  return {version:1,activeClassId:classId,
    classes:[{id:classId,name:'三年级（2）班',school:'示例小学',students}],
    rules,goods,records,
    settings:{expTable:[0,40,100,180,280,400,550,720],badges:[0,0,1,1,2,2,3,3,5]}};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s&&s.classes&&s.classes.length)return migrate(s);}}catch(e){}
  const d=demoState();localStorage.setItem(KEY,JSON.stringify(d));return d;
}
function migrate(s){
  s.settings=s.settings||{};
  s.settings.expTable=(Array.isArray(s.settings.expTable)&&s.settings.expTable.length===8)?s.settings.expTable:[0,40,100,180,280,400,550,720];
  s.settings.badges=(Array.isArray(s.settings.badges)&&s.settings.badges.length===9)?s.settings.badges:[0,0,1,1,2,2,3,3,5];
  s.records=s.records||[];s.goods=s.goods||[];s.rules=s.rules||[];
  s.classes.forEach(c=>c.students.forEach(st=>{st.acc=st.acc||[];st.status=st.status||{hunger:60,joy:60,health:80};st.badges=st.badges||0;st.exp=st.exp||0;}));
  return s;
}
let state=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){toast('本地存储不可用，数据未能保存','bad');}}
function curClass(){return state.classes.find(c=>c.id===state.activeClassId)||state.classes[0];}
function students(){return curClass().students;}
function findStu(id){return students().find(s=>s.id===id);}
function expTable(){return state.settings.expTable;}
function levelOf(exp){const t=expTable();for(let lv=8;lv>=1;lv--)if(exp>=t[lv-1])return lv;return 1;}
function lvProgress(exp){const lv=levelOf(exp),t=expTable();if(lv>=8)return 1;const a=t[lv-1],b=t[lv];return clamp((exp-a)/(b-a||1),0,1);}
function nextExp(exp){const lv=levelOf(exp);return lv>=8?t8():expTable()[lv];}
function t8(){return expTable()[7];}
function badgeSum(a,b){let n=0;const arr=state.settings.badges;for(let i=a+1;i<=b;i++)n+=(arr[i]||0);return n;}
function moodOf(s){if(!s.adopted)return 'calm';const st=s.status;if(st.health<35)return 'sick';if(st.joy<35||st.hunger<30)return 'sad';if(st.joy>75)return 'happy';return 'calm';}

   '<ellipse cx="100" cy="188" rx="42" ry="8" fill="rgba(31,42,68,.10)"/>'+
   '<g class="pet-bob"><path d="M100 46c30 0 48 40 48 70 0 27-21 48-48 48s-48-21-48-48c0-30 18-70 48-70Z" fill="#fff7ec" stroke="#e9d9c4" stroke-width="2"/>'+
   '<path d="M62 116h22l10-13 10 20 10-14 8 12h16" fill="none" stroke="#e7c9a6" stroke-width="3" stroke-linejoin="round"/>'+
   '<circle cx="76" cy="88" r="4" fill="#f4d9bd"/><circle cx="124" cy="76" r="5" fill="#f4d9bd"/><circle cx="132" cy="132" r="3.5" fill="#f4d9bd"/>'+
   '<path d="M88 140q12 10 24 0" stroke="#d9b894" stroke-width="2.5" fill="none" stroke-linecap="round"/></g></svg>';

function earSVG(type,sp){
  const d=sp.dark,b=sp.body;
  switch(type){
    case 'triangle':return '<path d="M70 62 64 26 94 50Z" fill="'+b+'" stroke="'+d+'" stroke-width="2" stroke-linejoin="round"/><path d="M130 62 136 26 106 50Z" fill="'+b+'" stroke="'+d+'" stroke-width="2" stroke-linejoin="round"/><path d="M73 56 70 37 87 51Z" fill="'+d+'" opacity=".35"/><path d="M127 56 130 37 113 51Z" fill="'+d+'" opacity=".35"/>';
    case 'long':return '<ellipse cx="80" cy="36" rx="11" ry="28" fill="'+b+'" stroke="'+d+'" stroke-width="2"/><ellipse cx="120" cy="36" rx="11" ry="28" fill="'+b+'" stroke="'+d+'" stroke-width="2"/><ellipse cx="80" cy="38" rx="4.5" ry="19" fill="#fff" opacity=".55"/><ellipse cx="120" cy="38" rx="4.5" ry="19" fill="#fff" opacity=".55"/>';
    case 'flop':return '<ellipse cx="67" cy="72" rx="14" ry="26" fill="'+d+'" transform="rotate(-18 67 72)"/><ellipse cx="133" cy="72" rx="14" ry="26" fill="'+d+'" transform="rotate(18 133 72)"/>';
    case 'round':return '<circle cx="71" cy="58" r="16" fill="'+d+'"/><circle cx="129" cy="58" r="16" fill="'+d+'"/>';
    case 'horn':return '<path d="M74 54 68 24 92 46Z" fill="#f3cf72" stroke="#d8a93c" stroke-width="2" stroke-linejoin="round"/><path d="M126 54 132 24 108 46Z" fill="#f3cf72" stroke="#d8a93c" stroke-width="2" stroke-linejoin="round"/><path d="M100 48 100 18 90 44Z" fill="'+ (sp.tail==='rainbow'?'#ffd66b':'#eaf7bd') +'" stroke="#d8a93c" stroke-width="1.5"/>';
    case 'none':return '<path d="M96 50q4-14 10-16" stroke="'+d+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
    default:return '';
  }
}
function tailSVG(type,sp){
  const b=sp.body,d=sp.dark;
  switch(type){
    case 'curl':return '<path d="M136 145q34 4 30-28" stroke="'+b+'" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M136 145q34 4 30-28" stroke="'+d+'" stroke-width="3" fill="none" stroke-linecap="round" opacity=".25"/>';
    case 'puff':return '<circle cx="140" cy="146" r="14" fill="'+(sp.tail==='puff'&&sp.ear==='round'?'#4a5269':b)+'"/>';
    case 'bushy':return '<path d="M134 150q38 8 32-30-2 14-16 12 8-10 4-20-24 12-20 38Z" fill="'+b+'" stroke="'+d+'" stroke-width="2" stroke-linejoin="round"/><path d="M162 122q4 16-6 26" stroke="#fff" stroke-width="5" fill="none" opacity=".7" stroke-linecap="round"/>';
    case 'spike':return '<path d="M136 152q26 6 34-22l-8 8-6-14-8 12-6-10Z" fill="'+d+'"/>';
    case 'rainbow':return '<path d="M136 150q30 10 34-24" stroke="#ff9ab0" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M136 156q36 10 40-20" stroke="#ffd66b" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M136 162q40 8 44-14" stroke="#8ad9c0" stroke-width="6" fill="none" stroke-linecap="round"/>';
    default:return '';
  }
}
function faceSVG(sp,mood){
  let eyes;
  if(mood==='sick')eyes='<path d="M80 84l10 10m0-10-10 10" stroke="#3c4661" stroke-width="3" stroke-linecap="round"/><path d="M110 84l10 10m0-10-10 10" stroke="#3c4661" stroke-width="3" stroke-linecap="round"/>';
  else if(mood==='sad')eyes='<path d="M80 92q5-5 10 0M110 92q5-5 10 0" stroke="#3c4661" stroke-width="3" fill="none" stroke-linecap="round"/>';
  else eyes='<circle cx="85" cy="88" r="5.4" fill="#2f3954"/><circle cx="115" cy="88" r="5.4" fill="#2f3954"/><circle cx="86.8" cy="86" r="1.9" fill="#fff"/><circle cx="116.8" cy="86" r="1.9" fill="#fff"/>';
  const mouth=mood==='happy'?'<path d="M90 101q10 11 20 0" stroke="#8b5a4a" stroke-width="2.6" fill="none" stroke-linecap="round"/>':
    mood==='sad'||mood==='sick'?'<path d="M91 106q9-7 18 0" stroke="#8b5a4a" stroke-width="2.6" fill="none" stroke-linecap="round"/>':
    '<path d="M94 102q6 6 12 0" stroke="#8b5a4a" stroke-width="2.6" fill="none" stroke-linecap="round"/>';
  const patch=sp.ear==='round'?'<ellipse cx="85" cy="88" rx="12" ry="14" fill="#3b4359" opacity=".85"/><ellipse cx="115" cy="88" rx="12" ry="14" fill="#3b4359" opacity=".85"/>':'';
  return patch+eyes+'<ellipse cx="72" cy="100" rx="8" ry="4.5" fill="#ff8f9e" opacity=".5"/><ellipse cx="128" cy="100" rx="8" ry="4.5" fill="#ff8f9e" opacity=".5"/>'+
    '<path d="M100 96v3" stroke="#c8896b" stroke-width="2" stroke-linecap="round"/>'+mouth+
    (mood==='sick'?'<rect x="80" y="40" width="40" height="11" rx="5" fill="#bfe3f5" opacity=".9" transform="rotate(-8 100 45)"/>':'');
}
function accSVG(list,lv){
  let o='';
  if(list.includes('wings'))o+='<path d="M62 118q-30-18-34 4 4 20 34 12Z" fill="#fff" stroke="#dfe7f5" stroke-width="2"/><path d="M138 118q30-18 34 4-4 20-34 12Z" fill="#fff" stroke="#dfe7f5" stroke-width="2"/>';
  if(list.includes('hat'))o+='<path d="M66 52q34-38 68 0Z" fill="#ef6a73"/><rect x="60" y="49" width="80" height="9" rx="4.5" fill="#d9535d"/><circle cx="100" cy="19" r="6" fill="#fff"/>';
  if(list.includes('crown'))o+='<path d="M68 48 74 26 88 40 100 20 112 40 126 26 132 48Z" fill="#f5c33f" stroke="#d9a326" stroke-width="2" stroke-linejoin="round"/><circle cx="100" cy="40" r="3" fill="#ef6a73"/>';
  if(list.includes('bow'))o+='<path d="M132 58q16-14 20 0-4 14-20 0Z" fill="#ef6a73"/><path d="M132 58q-16-14-20 0 4 14 20 0Z" fill="#ef6a73"/><circle cx="132" cy="58" r="5" fill="#d9535d"/>';
  if(list.includes('scarf'))o+='<path d="M74 114q26 14 52 0l3 12q-28 14-58 0Z" fill="#5b8def"/><path d="M120 124l8 22 8-4-6-20Z" fill="#4774d8"/>';
  if(list.includes('glasses'))o+='<circle cx="85" cy="88" r="12" fill="none" stroke="#4a5872" stroke-width="2.6"/><circle cx="115" cy="88" r="12" fill="none" stroke="#4a5872" stroke-width="2.6"/><path d="M97 88h6" stroke="#4a5872" stroke-width="2.6"/>';
  if(list.includes('medal'))o+='<path d="M86 118 100 128 114 118" fill="none" stroke="#e8585f" stroke-width="4"/><circle cx="100" cy="138" r="10" fill="#f5c33f" stroke="#d9a326" stroke-width="2"/>';
  if(lv>=7)o+='<circle cx="100" cy="86" r="62" fill="none" stroke="#f5c33f" stroke-width="3" opacity=".55" stroke-dasharray="6 9"/>';
  return o;
}
function petSVG(s,small){
  if(!s.adopted)return eggSVG();
  const sp=SPECIES[s.species]||SPECIES.cat,lv=levelOf(s.exp),mood=moodOf(s);
  const k=0.72+lv*0.043;
  const spark=lv>=5?'<g opacity=".85"><path d="M32 52l3 8 8 3-8 3-3 8-3-8-8-3 8-3Z" fill="#f5c33f"/><path d="M168 40l2 6 6 2-6 2-2 6-2-6-6-2 6-2Z" fill="#8b7cf1"/></g>':'';
  return '<svg class="pet-svg'+(small?' small':'')+'" viewBox="0 0 200 210" role="img" aria-label="'+esc(s.petName||sp.n)+' Lv.'+lv+'">'+
    '<ellipse cx="100" cy="190" rx="'+(42*k).toFixed(1)+'" ry="8" fill="rgba(31,42,68,.10)"/>'+
    '<g class="pet-bob" transform="translate(100,165) scale('+k.toFixed(3)+') translate(-100,-165)">'+
      (lv>=6?'<ellipse cx="100" cy="86" rx="70" ry="70" fill="#ffdf8a" opacity=".28"/>':'')+
      tailSVG(sp.tail,sp)+
      '<ellipse cx="82" cy="170" rx="15" ry="9" fill="'+sp.dark+'"/><ellipse cx="118" cy="170" rx="15" ry="9" fill="'+sp.dark+'"/>'+
      '<ellipse cx="100" cy="132" rx="40" ry="42" fill="'+sp.body+'"/>'+
      '<ellipse cx="100" cy="140" rx="27" ry="30" fill="'+sp.belly+'"/>'+
      '<ellipse cx="70" cy="132" rx="10" ry="19" fill="'+sp.body+'" transform="rotate(-18 70 132)"/>'+
      '<ellipse cx="130" cy="132" rx="10" ry="19" fill="'+sp.body+'" transform="rotate(18 130 132)"/>'+
      earSVG(sp.ear,sp)+
      '<circle cx="100" cy="86" r="37" fill="'+sp.body+'"/>'+
      '<ellipse cx="100" cy="98" rx="24" ry="17" fill="'+sp.belly+'" opacity=".85"/>'+
      faceSVG(sp,mood)+accSVG(s.acc||[],lv)+
    '</g>'+spark+'</svg>';
}

function toast(msg,type){
  const box=document.getElementById('toast'),el=document.createElement('div');
  el.className='toast '+(type||'');el.textContent=msg;box.appendChild(el);

}

function recList(list,compact){
  if(!list.length)return '<div class="empty" style="padding:26px">'+ic('clock')+'<strong>暂无记录</strong>加减分后会显示在这里</div>';
  return '<div class="rec-list">'+list.map(r=>{
    const s=findStu(r.studentId),cls=r.kind==='exchange'?'other':(r.delta>0?'plus':'minus');
    const sign=r.delta>0?'+':'';
    return '<div class="rec'+(r.undone?' undone':'')+'"><div class="rec-ico '+cls+'">'+(r.kind==='exchange'?ic('gift',17):(r.delta>0?ic('plus',16):ic('close',16)))+'</div>'+
      '<div class="rec-main"><strong>'+esc(s?s.name:'已移除的同学')+' · '+esc(r.label)+'</strong><span>'+fmt(r.ts)+(r.cat?' · '+esc(r.cat):'')+(r.undone?' · 已撤回':'')+'</span></div>'+
      '<div class="rec-val '+(r.kind==='exchange'?'':cls)+'">'+(r.kind==='exchange'?'兑换':sign+r.delta)+'</div>'+
      (!r.undone&&r.kind==='score'?btn('undo-rec','撤回','sm ghost',r.id):'')+'</div>';
  }).join('')+'</div>';
}
function sortedBy(period){
  const ss=students().slice();
  const score=s=>{
    if(period==='total')return s.exp;
    const from=period==='week'?weekStart():new Date().setHours(0,0,0,0);
    return state.records.filter(r=>!r.undone&&r.kind==='score'&&r.studentId===s.id&&r.ts>=from).reduce((a,r)=>a+r.delta,0);
  };
  return ss.map(s=>({s,v:score(s)})).sort((a,b)=>b.v-a.v||a.s.seat-b.s.seat);
}

/* ==================== 业务逻辑 ==================== */
function adjust(s,delta){
  const before=levelOf(s.exp);
  s.exp=Math.max(0,s.exp+delta);
  const after=levelOf(s.exp);
  if(after>before){const g=badgeSum(before,after);s.badges+=g;lastLevelUp=s.id;toast(s.name+' 的宠物升到 Lv.'+after+'，获得 '+g+' 枚徽章','ok');}
  if(after<before)s.badges=Math.max(0,s.badges-badgeSum(after,before));
  const st=s.status;
  if(delta>0){st.hunger=clamp(st.hunger+3,0,100);st.joy=clamp(st.joy+4,0,100);st.health=clamp(st.health+1,0,100);}
  else{st.hunger=clamp(st.hunger-2,0,100);st.joy=clamp(st.joy-5,0,100);st.health=clamp(st.health-6,0,100);}
}
function award(ids,rule){
  if(!ids.length){toast('请先选择至少一位同学','bad');return;}
  ids.forEach(id=>{
    const s=findStu(id);if(!s)return;
    adjust(s,rule.delta);
    state.records.unshift({id:uid(),ts:Date.now(),classId:state.activeClassId,studentId:id,label:rule.label,delta:rule.delta,cat:rule.cat,kind:'score',undone:false});
  });
  save();renderAll();
  toast('已为 '+ids.length+' 位同学记录「'+rule.label+'」','ok');
}
function undoRecord(id){
  const r=state.records.find(x=>x.id===id);if(!r||r.undone)return;
  const s=findStu(r.studentId);
  if(s)adjust(s,-r.delta);
  r.undone=true;save();renderAll();toast('已撤回该条评价','ok');
}

function download(name,text,type){
  const blob=new Blob([type==='text/csv'?'\ufeff'+text:text],{type:(type||'text/plain')+';charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);toast('已导出 '+name,'ok');
}
function exportCSV(){
  const rows=[['时间','班级','学生','事项','分类','分值','状态']];
  state.records.filter(r=>r.classId===state.activeClassId).forEach(r=>{
    const s=findStu(r.studentId);
    rows.push([new Date(r.ts).toLocaleString('zh-CN'),curClass().name,s?s.name:'已移除',r.label,r.cat||'',r.kind==='exchange'?'兑换':r.delta,r.undone?'已撤回':r.kind==='exchange'?'已兑换':'有效']);
  });
  const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  download(curClass().name+'-评价台账.csv',csv,'text/csv');
}

  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case 'nav':view=el.dataset.view;document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));renderChrome();break;
    case 'manage-tab':manageTab=el.dataset.tab;renderManage();break;
    case 'close-modal':closeModal();break;
    case 'screen-enter':document.body.classList.add('screen-mode');view='garden';document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-garden'));renderChrome();
      try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();}catch(err){}break;
    case 'screen-exit':document.body.classList.remove('screen-mode');renderChrome();try{document.fullscreenElement&&document.exitFullscreen();}catch(err){}break;
    case 'add-student':openAddStudent();break;
    case 'batch-import':openBatch();break;
    case 'do-add-student':{
      const n=document.getElementById('stuName').value.trim();if(!n){toast('请填写姓名','bad');return;}
      students().push({id:uid(),name:n,seat:document.getElementById('stuSeat').value.trim(),adopted:false,species:'cat',petName:'',exp:0,badges:0,acc:[],status:{hunger:60,joy:60,health:80},interactDate:'',interactLeft:3});
      save();closeModal();renderAll();toast('已添加 '+n,'ok');break;}
    case 'do-batch':{
      const lines=document.getElementById('batchText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
      const exists=new Set(students().map(s=>s.name));let n=0;
      lines.forEach(line=>{const [name,seat]=line.split(/[,，\t]+/).map(x=>(x||'').trim());
        if(!name||exists.has(name))return;exists.add(name);
        students().push({id:uid(),name,seat:seat||'',adopted:false,species:'cat',petName:'',exp:0,badges:0,acc:[],status:{hunger:60,joy:60,health:80},interactDate:'',interactLeft:3});n++;});
      save();closeModal();renderAll();toast('成功导入 '+n+' 位同学'+(lines.length-n?'，跳过重复或空行 '+(lines.length-n)+' 行':''),'ok');break;}
    case 'del-student':confirmBox('删除同学','确认删除该同学？其历史评价记录会保留，但宠物数据将移除。','do-del-student',id);break;
    case 'do-del-student':{const arr=students(),i=arr.findIndex(s=>s.id===id);if(i>=0)arr.splice(i,1);selected.delete(id);save();closeModal();renderAll();toast('已删除','ok');break;}
    case 'open-pet':openPet(id);break;
    case 'open-adopt':openAdopt(id);break;
    case 'pick-adopt':window._adoptSpecies=el.dataset.species;document.querySelectorAll('#adoptGrid .species-opt').forEach(x=>x.classList.toggle('on',x===el));break;
    case 'confirm-adopt':{
      const s=findStu(id);if(!s)break;
      const nm=document.getElementById('adoptName').value.trim();
      s.adopted=true;s.species=window._adoptSpecies||'cat';s.petName=nm||SPECIES[s.species].n;s.status={hunger:60,joy:60,health:80};
      save();closeModal();renderAll();toast(s.name+' 领养了 '+s.petName,'ok');break;}
    case 'pick-species':{const s=findStu(id);if(!s)break;s.species=el.dataset.species;save();closeModal();openPet(id);renderAll();break;}
    case 'toggle-acc':{const s=findStu(id),a=el.dataset.acc;if(!s)break;
      if(!s.acc.includes(a)){toast('尚未拥有该装饰，请到小卖部兑换','bad');return;}
      const i=s.acc.indexOf(a);if(i>=0)s.acc.splice(i,1);else s.acc.push(a);
      save();closeModal();openPet(id);renderAll();break;}
    case 'quick-award':{const r=state.rules.find(x=>x.id===el.dataset.rule);if(!r){toast('评价项不存在','bad');break;}award([id],r);closeModal();break;}
    case 'interact':{const s=findStu(id);if(!s)break;
      if(s.interactDate===todayKey()&&s.interactLeft<=0){toast('今天的互动次数已用完','bad');break;}
      if(s.interactDate!==todayKey()){s.interactDate=todayKey();s.interactLeft=3;}
      s.interactLeft--;s.status.hunger=clamp(s.status.hunger+12,0,100);s.status.joy=clamp(s.status.joy+12,0,100);s.status.health=clamp(s.status.health+8,0,100);
      save();closeModal();openPet(id);renderAll();toast('互动成功，宠物状态提升（今日剩余 '+s.interactLeft+' 次）','ok');break;}
    case 'save-pet':{const s=findStu(id);if(!s)break;
      const n=document.getElementById('petStuName').value.trim(),p=document.getElementById('petNameInput').value.trim();
      if(n)s.name=n;s.petName=p||SPECIES[s.species].n;save();closeModal();renderAll();toast('已保存','ok');break;}
    case 'select-all':students().forEach(s=>selected.add(s.id));renderScore();break;
    case 'clear-sel':selected.clear();renderScore();break;
    case 'toggle-sel':selected.has(id)?selected.delete(id):selected.add(id);renderScore();break;
    case 'rule-cat':ruleCat=el.dataset.cat;renderScore();break;
    case 'apply-rule':{const r=state.rules.find(x=>x.id===id);if(r)award(Array.from(selected),r);break;}
    case 'rank-period':rankPeriod=el.dataset.period;renderRank();break;
    case 'undo-rec':undoRecord(id);break;
    case 'exchange':openExchange(id);break;
    case 'do-exchange':{
      const g=state.goods.find(x=>x.id===id),sid=document.getElementById('exStu').value,s=findStu(sid);
      if(!g||!s)break;
      if(s.badges<g.cost){toast('徽章不足，还差 '+(g.cost-s.badges)+' 枚','bad');break;}
      if(g.stock===0){toast('库存已兑完','bad');break;}
      s.badges-=g.cost;if(g.stock>0)g.stock--;
      if(g.kind&&g.kind.startsWith('acc:')){const a=g.kind.split(':')[1];if(!s.acc.includes(a))s.acc.push(a);}
      state.records.unshift({id:uid(),ts:Date.now(),classId:state.activeClassId,studentId:sid,label:'兑换 '+g.name,delta:0,cat:'',kind:'exchange',undone:false});
      save();closeModal();renderAll();toast(s.name+' 兑换了 '+g.name,'ok');break;}
    case 'add-good':openAddGood();break;
    case 'do-add-good':{
      const n=document.getElementById('goodName').value.trim();if(!n){toast('请填写商品名称','bad');break;}
      state.goods.push({id:uid(),name:n,desc:document.getElementById('goodDesc').value.trim(),
        cost:Math.max(1,parseInt(document.getElementById('goodCost').value)||1),stock:parseInt(document.getElementById('goodStock').value),
        icon:'gift',color:'#5965e8',kind:document.getElementById('goodKind').value});
      save();closeModal();renderShop();toast('商品已上架','ok');break;}
    case 'del-good':confirmBox('下架商品','确认从货架移除该商品？','do-del-good',id);break;
    case 'do-del-good':{state.goods=state.goods.filter(g=>g.id!==id);save();closeModal();renderShop();break;}
    case 'add-rule':openAddRule();break;
    case 'do-add-rule':{
      const l=document.getElementById('ruleLabel').value.trim();if(!l){toast('请填写评价项名称','bad');break;}
      state.rules.push({id:uid(),label:l,cat:document.getElementById('ruleCatSel').value,delta:parseInt(document.getElementById('ruleDelta').value)||0});
      save();closeModal();renderAll();toast('规则已添加','ok');break;}
    case 'del-rule':{state.rules=state.rules.filter(r=>r.id!==id);save();renderManage();toast('规则已删除','ok');break;}
    case 'save-growth':{
      const t=expTable(),b=state.settings.badges;
      for(let i=1;i<8;i++){const a=parseInt(document.getElementById('exp-'+i).value);if(Number.isFinite(a)&&a>=0)t[i]=a;}
      for(let i=1;i<8;i++){if(t[i]<=t[i-1])t[i]=t[i-1]+20;}
      for(let i=0;i<8;i++){const a=parseInt(document.getElementById('bd-'+i).value);if(Number.isFinite(a)&&a>=0)b[i+1]=a;}
      save();renderAll();toast('成长设置已保存','ok');break;}
    case 'save-class':{const c=curClass();c.name=document.getElementById('classNameInput').value.trim()||c.name;c.school=document.getElementById('schoolInput').value.trim();save();renderAll();toast('班级信息已更新','ok');break;}
    case 'add-class':{
      const name='新建班级 '+(state.classes.length+1);
      state.classes.push({id:uid(),name,school:'',students:[]});state.activeClassId=state.classes[state.classes.length-1].id;
      selected.clear();save();renderAll();toast('已创建 '+name+'，可在顶部切换','ok');break;}
    case 'del-class':confirmBox('删除班级','确认删除该班级及其全部学生数据？此操作不可撤销。','do-del-class',id);break;
    case 'do-del-class':{state.classes=state.classes.filter(c=>c.id!==id);state.activeClassId=state.classes[0].id;
      state.records=state.records.filter(r=>r.classId!==id);selected.clear();save();closeModal();renderAll();break;}
    case 'export-csv':exportCSV();break;
    case 'export-json':download('班级宠物园-备份-'+todayKey()+'.json',JSON.stringify(state,null,2),'application/json');break;
    case 'reset-demo':confirmBox('重新载入示例','将清空当前全部数据并恢复示例班级，建议先导出备份。','do-reset-demo','');break;
    case 'do-reset-demo':{state=demoState();selected.clear();save();closeModal();renderAll();toast('示例数据已恢复','ok');break;}
    case 'clear-all':confirmBox('清空全部数据','将删除所有班级、学生、规则、商品与记录，且不可撤销。建议先导出 JSON 备份。','do-clear-all','');break;
    case 'do-clear-all':{
      const id=uid();state={version:1,activeClassId:id,classes:[{id,name:'我的班级',school:'',students:[]}],rules:[],goods:[],records:[],
        settings:{expTable:[0,40,100,180,280,400,550,720],badges:[0,0,1,1,2,2,3,3,5]}};
      selected.clear();save();closeModal();renderAll();toast('数据已清空','ok');break;}
    case 'random-pick':openRandom();break;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='classSelect'){state.activeClassId=e.target.value;selected.clear();save();renderAll();}
  if(e.target.id==='importFile'){
    const f=e.target.files[0];if(!f)return;
    const rd=new FileReader();rd.onload=()=>{
      try{const d=JSON.parse(rd.result);if(!d.classes||!d.classes.length)throw new Error('格式错误');
        state=migrate(d);save();renderAll();toast('备份导入成功','ok');}
      catch(err){toast('导入失败：文件不是有效的备份','bad');}
    };rd.readAsText(f);e.target.value='';
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='gardenSearch'){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#petGrid .pet-card').forEach(c=>{
      if(c.classList.contains('adopt-card'))return;
      c.classList.toggle('hidden',!!q&&!(c.dataset.search||'').toLowerCase().includes(q));});
  }
  if(e.target.id==='ruleSearch'){
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('#ruleGrid .rule').forEach(c=>c.classList.toggle('hidden',!!q&&!(c.dataset.search||'').toLowerCase().includes(q)));
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.body.classList.remove('screen-mode');}});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('screen-mode');});
renderAll();
</script>
</body>
</html>
